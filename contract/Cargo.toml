[workspace]

[package]
name = "soro_task_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.2"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }
proptest = "1.5.0"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.9"

[features]
testutils = ["soroban-sdk/testutils"]

[package.metadata.tarpaulin]
timeout = 600
out = ["Xml"]
exclude-files = ["fuzz/*"]