[package]
name = "soro_task_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"
vrf-rfc9381 = { version = "0.0.7", default-features = false, features = ["edwards25519"] }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
proptest = "1.5.0"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"

[features]
testutils = ["soroban-sdk/testutils"]

[package.metadata.tarpaulin]
timeout = 600
out = ["Xml"]
exclude-files = ["fuzz/*"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true