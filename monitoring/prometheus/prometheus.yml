# Prometheus Configuration for SoroTask
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "sorotask-keeper"
    # 5s scrape keeps blue/green canary telemetry fresh enough for the
    # 15-second automated rollback budget (#1657).
    scrape_interval: 5s
    static_configs:
      - targets: ["keeper:3000"]

  - job_name: "sorotask-indexer"
    static_configs:
      - targets: ["indexer:4000"]

  - job_name: "zk-proof-service"
    static_configs:
      - targets: ["zk-proof-service:5000"]
