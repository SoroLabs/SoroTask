name: Rust Contract CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract:
    name: Contract fmt / clippy / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Lint (clippy, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test

      - name: Build WASM Release
        run: cargo build --target wasm32v1-none --release || cargo build --target wasm32-unknown-unknown --release

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: contract
          fail_ci_if_error: false
