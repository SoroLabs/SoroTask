name: PR Size Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-and-check-size:
    name: Label PR by Size and Enforce Limit
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Compute diff size, apply label, and enforce limit
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalLines = additions + deletions;

            const SIZE_TIERS = [
              { label: 'size/xs', color: '3cbf00', description: 'Extra-small PR (< 10 lines)', max: 10 },
              { label: 'size/s', color: '5d9e00', description: 'Small PR (10-99 lines)', max: 100 },
              { label: 'size/m', color: 'e6b800', description: 'Medium PR (100-299 lines)', max: 300 },
              { label: 'size/l', color: 'eb6420', description: 'Large PR (300-999 lines)', max: 1000 },
              { label: 'size/xl', color: 'ee0701', description: 'Extra-large PR (>= 1,000 lines)', max: Infinity },
            ];

            const tier = SIZE_TIERS.find((candidate) => totalLines < candidate.max);

            async function tryIssueMutation(description, action) {
              try {
                return await action();
              } catch (error) {
                core.warning(`${description} skipped: ${error.message}`);
                return null;
              }
            }

            for (const sizeTier of SIZE_TIERS) {
              const existing = await tryIssueMutation(
                `Checking label ${sizeTier.label}`,
                () => github.rest.issues.getLabel({ owner, repo, name: sizeTier.label }),
              );

              if (!existing) {
                await tryIssueMutation(
                  `Creating label ${sizeTier.label}`,
                  () => github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: sizeTier.label,
                    color: sizeTier.color,
                    description: sizeTier.description,
                  }),
                );
              }
            }

            const current = await tryIssueMutation(
              'Listing PR labels',
              () => github.rest.issues.listLabelsOnIssue({
                owner,
                repo,
                issue_number: prNumber,
              }),
            );

            for (const label of current?.data || []) {
              if (label.name.startsWith('size/')) {
                await tryIssueMutation(
                  `Removing stale label ${label.name}`,
                  () => github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: label.name,
                  }),
                );
              }
            }

            await tryIssueMutation(
              `Applying label ${tier.label}`,
              () => github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [tier.label],
              }),
            );

            console.log(
              `PR #${prNumber}: +${additions} additions / -${deletions} deletions ` +
              `= ${totalLines} total lines -> ${tier.label}`,
            );

            if (totalLines >= 1000) {
              await tryIssueMutation(
                'Posting PR size guidance comment',
                () => github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: [
                    '## PR Too Large - Please Split',
                    '',
                    `This PR touches **${totalLines} lines** ` +
                    `(+${additions} additions, -${deletions} deletions), ` +
                    `which exceeds the project's **1,000-line limit**.`,
                    '',
                    'Please break this into smaller, focused PRs before requesting review.',
                  ].join('\n'),
                }),
              );

              core.warning(
                `PR #${prNumber} exceeds the 1,000 line guidance (${totalLines} lines changed).`,
              );
            }
