name: Production & Preview Global Edge Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "terraform/**"
      - "charts/sorotask-keeper/**"
      - "keeper/src/deploy/**"
      - "keeper/scripts/blue-green-deploy.js"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "terraform/**"
      - "charts/sorotask-keeper/**"
      - "keeper/src/deploy/**"
      - "keeper/scripts/blue-green-deploy.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production rollout half-way through a traffic shift.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changed Areas
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff Against Base
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch, force-push or unknown base: run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(frontend/|\.github/workflows/deploy\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^(terraform/|charts/sorotask-keeper/|keeper/src/deploy/|keeper/scripts/blue-green-deploy\.js$|\.github/workflows/deploy\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Build & Unit Tests
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Run Unit & Component Tests
        run: npm test -- --passWithNoTests

      - name: Production Next.js Build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ github.ref == 'refs/heads/main' && 'mainnet' || 'testnet' }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ github.ref == 'refs/heads/main' && 'https://rpc-mainnet.stellar.org' || 'https://soroban-testnet.stellar.org' }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  deploy-edge:
    name: Deploy Preview or Production to Vercel
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      rollback_target_url: ${{ steps.rollback-target.outputs.rollback_target_url }}
      target_environment: ${{ steps.environment.outputs.target_environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Determine Target Environment
        id: environment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "target_environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "target_environment=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Vercel Credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets."
            exit 1
          fi

      - name: Find Previous Production Deployment
        id: rollback-target
        if: steps.environment.outputs.target_environment == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          query_args=(
            --data-urlencode "projectId=$VERCEL_PROJECT_ID"
            --data-urlencode "target=production"
            --data-urlencode "state=READY"
            --data-urlencode "rollbackCandidate=true"
            --data-urlencode "limit=20"
          )
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            query_args+=(--data-urlencode "teamId=$VERCEL_ORG_ID")
          fi
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "${query_args[@]}" \
            https://api.vercel.com/v7/deployments)"
          candidate="$(jq -r '.deployments[] | select(.url != null) | .url' <<< "$response" | head -n 1)"
          if [[ "$candidate" == https://*.vercel.app ]]; then
            rollback_target_url="$candidate"
          elif [[ "$candidate" == *.vercel.app ]]; then
            rollback_target_url="https://$candidate"
          elif [[ -n "$candidate" ]]; then
            echo "::error::Vercel returned an unexpected rollback candidate URL."
            exit 1
          else
            rollback_target_url=""
            echo "::warning::No previous production rollback candidate is available."
          fi
          echo "rollback_target_url=$rollback_target_url" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel Project Settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@66.6.0 pull --yes --environment="${{ steps.environment.outputs.target_environment }}"

      - name: Build Vercel Deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ steps.environment.outputs.target_environment == 'production' && 'mainnet' || 'testnet' }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ steps.environment.outputs.target_environment == 'production' && 'https://rpc-mainnet.stellar.org' || 'https://soroban-testnet.stellar.org' }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          if [[ "${{ steps.environment.outputs.target_environment }}" == "production" ]]; then
            npx --yes vercel@66.6.0 build --prod
          else
            npx --yes vercel@66.6.0 build
          fi

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ "${{ steps.environment.outputs.target_environment }}" == "production" ]]; then
            deployment_url="$(npx --yes vercel@66.6.0 deploy --prebuilt --prod --yes)"
          else
            deployment_url="$(npx --yes vercel@66.6.0 deploy --prebuilt --yes)"
          fi
          if [[ "$deployment_url" != https://*.vercel.app ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.environment.outputs.target_environment }} to $deployment_url"

  canary-smoke:
    name: Post-Deployment Playwright Canary
    needs: deploy-edge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke Test Deployment and Wallet Connection
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-edge.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e:ci -- tests/e2e/deployment-smoke.spec.ts --project=chromium

  rollback-after-failed-canary:
    name: Automatically Roll Back Failed Production Canary
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.canary-smoke.result == 'failure'
    needs:
      - deploy-edge
      - canary-smoke
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ROLLBACK_TARGET_URL: ${{ needs.deploy-edge.outputs.rollback_target_url }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Roll Back Production
        run: |
          if [[ -z "$ROLLBACK_TARGET_URL" ]]; then
            echo "::error::Canary failed, but no previous production deployment is available to roll back to."
            exit 1
          fi
          npx --yes vercel@66.6.0 rollback "$ROLLBACK_TARGET_URL" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --non-interactive

  rollback-on-demand:
    name: Roll Back Production on Demand
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require Vercel Credentials
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets."
            exit 1
          fi

      - name: Find Previous Production Deployment
        id: rollback-target
        run: |
          query_args=(
            --data-urlencode "projectId=$VERCEL_PROJECT_ID"
            --data-urlencode "target=production"
            --data-urlencode "state=READY"
            --data-urlencode "rollbackCandidate=true"
            --data-urlencode "limit=20"
          )
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            query_args+=(--data-urlencode "teamId=$VERCEL_ORG_ID")
          fi
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "${query_args[@]}" \
            https://api.vercel.com/v7/deployments)"
          candidate="$(jq -r '.deployments[] | select(.url != null) | .url' <<< "$response" | head -n 1)"
          if [[ "$candidate" == https://*.vercel.app ]]; then
            rollback_target_url="$candidate"
          elif [[ "$candidate" == *.vercel.app ]]; then
            rollback_target_url="https://$candidate"
          else
            echo "::error::No valid previous production rollback candidate is available."
            exit 1
          fi
          echo "rollback_target_url=$rollback_target_url" >> "$GITHUB_OUTPUT"

      - name: Roll Back Production
        env:
          ROLLBACK_TARGET_URL: ${{ steps.rollback-target.outputs.rollback_target_url }}
        run: |
          npx --yes vercel@66.6.0 rollback "$ROLLBACK_TARGET_URL" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --non-interactive

  # ── Keeper backend: Blue/Green with automated canary routing (#1657) ───────
  blue-green-validate:
    name: Blue/Green Pipeline Validation (terraform + canary controller)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Terraform Tests (mocked providers, no cloud access)
        run: terraform -chdir=terraform test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Keeper Dependencies
        working-directory: keeper
        run: npm install --workspaces=false --no-save --no-package-lock --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Canary Controller Unit, Drain Integration & Stress Tests
        working-directory: keeper
        run: >-
          npx jest --coverage=false
          __tests__/canaryController.test.js
          __tests__/blueGreenDrain.test.js
          __tests__/canaryStress.test.js

      - name: Simulated Rollout (healthy candidate must promote)
        working-directory: keeper
        run: node scripts/blue-green-deploy.js --simulate --stable blue --candidate green

      - name: Simulated Rollout (faulty candidate must roll back)
        working-directory: keeper
        run: |
          set +e
          node scripts/blue-green-deploy.js --simulate --stable blue --candidate green --fault-rate 0.05
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "::error::expected automated rollback (exit 2), got exit $code"
            exit 1
          fi
          echo "Automated rollback verified."

  keeper-blue-green-deploy:
    name: Keeper Blue/Green Canary Rollout (10% -> 50% -> 100%)
    needs: blue-green-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The EKS API endpoint and Prometheus are private: point this at a runner
    # inside the VPC with the KEEPER_DEPLOY_RUNNER repository variable.
    runs-on: ${{ vars.KEEPER_DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'sorotask-production' }}
      K8S_NAMESPACE: ${{ vars.KEEPER_NAMESPACE || 'sorotask' }}
      ALB_LISTENER_ARN: ${{ vars.KEEPER_LISTENER_ARN }}
      BLUE_TARGET_GROUP_ARN: ${{ vars.KEEPER_BLUE_TARGET_GROUP_ARN }}
      GREEN_TARGET_GROUP_ARN: ${{ vars.KEEPER_GREEN_TARGET_GROUP_ARN }}
      PROMETHEUS_URL: ${{ vars.KEEPER_PROMETHEUS_URL }}
      DEPLOY_ROLE_ARN: ${{ secrets.KEEPER_DEPLOY_ROLE_ARN }}
      IMAGE_REPOSITORY: ghcr.io/sorolabs/sorotask-keeper
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check Deployment Configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ] || [ -z "$ALB_LISTENER_ARN" ] || [ -z "$PROMETHEUS_URL" ]; then
            echo "::notice::Blue/green deploy is not configured (KEEPER_DEPLOY_ROLE_ARN / KEEPER_LISTENER_ARN / KEEPER_PROMETHEUS_URL); skipping live rollout."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Configure AWS Credentials (OIDC)
        if: steps.cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Helm
        if: steps.cfg.outputs.enabled == 'true'
        uses: azure/setup-helm@v4

      - name: Determine Live and Candidate Colors
        if: steps.cfg.outputs.enabled == 'true'
        id: colors
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          LIVE_TG=$(aws elbv2 describe-listeners --listener-arns "$ALB_LISTENER_ARN" \
            --query 'Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups[?Weight==`100`].TargetGroupArn | [0]' \
            --output text)
          if [ "$LIVE_TG" = "$GREEN_TARGET_GROUP_ARN" ]; then LIVE=green; CANDIDATE=blue; \
          elif [ "$LIVE_TG" = "$BLUE_TARGET_GROUP_ARN" ]; then LIVE=blue; CANDIDATE=green; \
          else echo "::error::listener is not at a clean 100/0 split (a rollout may be in progress)"; exit 1; fi
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Live: $LIVE, candidate: $CANDIDATE"

      - name: Deploy Candidate Color (no traffic yet)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          CANDIDATE=${{ steps.colors.outputs.candidate }}
          TG_VAR=$( [ "$CANDIDATE" = blue ] && echo "$BLUE_TARGET_GROUP_ARN" || echo "$GREEN_TARGET_GROUP_ARN" )
          helm upgrade --install "sorotask-keeper-$CANDIDATE" charts/sorotask-keeper \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set blueGreen.enabled=true \
            --set blueGreen.color="$CANDIDATE" \
            --set blueGreen.targetGroupArn="$TG_VAR" \
            --set secrets.create=false \
            --set secrets.existingSecret=sorotask-keeper-secrets \
            --wait --timeout 10m
          # Every candidate target must pass the ALB /readyz health check
          # before it receives any traffic.
          for i in $(seq 1 60); do
            UNHEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$TG_VAR" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State!=`healthy`])' --output text)
            TOTAL=$(aws elbv2 describe-target-health --target-group-arn "$TG_VAR" \
              --query 'length(TargetHealthDescriptions)' --output text)
            if [ "$TOTAL" -gt 0 ] && [ "$UNHEALTHY" -eq 0 ]; then echo "All $TOTAL targets healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::candidate targets never became healthy"; exit 1

      - name: Canary Traffic Shift with Automated Rollback
        if: steps.cfg.outputs.enabled == 'true'
        id: canary
        working-directory: keeper
        run: |
          node scripts/blue-green-deploy.js \
            --stable ${{ steps.colors.outputs.live }} \
            --candidate ${{ steps.colors.outputs.candidate }}

      - name: Retire Previous Color (graceful drain)
        if: steps.cfg.outputs.enabled == 'true' && steps.canary.outputs.outcome == 'promoted'
        run: |
          # Traffic is already 100% on the new color. Uninstalling the old
          # release deletes its pods with their full termination grace period:
          # preStop sleep -> SIGTERM -> readiness 503 -> in-flight transactions
          # finish -> exit, while the ALB drains open connections. (Uninstall
          # rather than scale-to-zero so KEDA/HPA cannot scale it back up.)
          helm uninstall "sorotask-keeper-${{ steps.colors.outputs.live }}" \
            --namespace "$K8S_NAMESPACE" --wait --timeout 5m

      - name: Retire Failed Candidate After Rollback
        # Only when traffic is known to be 100% on the previous color: the
        # controller rolled back, or the canary never started shifting.
        if: >-
          failure() && steps.cfg.outputs.enabled == 'true' && steps.colors.outputs.candidate != '' &&
          (steps.canary.outputs.outcome == 'rolled_back' || steps.canary.conclusion == 'skipped')
        run: |
          helm uninstall "sorotask-keeper-${{ steps.colors.outputs.candidate }}" \
            --namespace "$K8S_NAMESPACE" --wait --timeout 5m || true
          echo "::error::Canary rolled back; ${{ steps.colors.outputs.live }} remains live."
