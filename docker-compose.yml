version: "3.9"

services:
  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sorotask}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sorotask}"
      POSTGRES_DB: "${POSTGRES_DB:-sorotask}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sorotask} -d ${POSTGRES_DB:-sorotask}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Migration runner ────────────────────────────────────────────────────────
  # Runs knex migrations against Postgres/TimescaleDB once the DB is healthy.
  # Indexer and keeper wait for this to complete successfully before starting.
  migrate:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    command: ["npx", "knex", "--knexfile", "knexfile.js", "migrate:latest"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sorotask}:${POSTGRES_PASSWORD:-sorotask}@postgres:5432/${POSTGRES_DB:-sorotask}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keeper:
    build:
      context: ./keeper
      dockerfile: Dockerfile
    # Load all environment variables from keeper/.env
    # Copy keeper/.env.example → keeper/.env and fill in your values before running.
    env_file:
      - ./keeper/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Persist the task registry (data/tasks.json) across container restarts.
      - ./keeper/data:/app/data
    ports:
      # Expose the health / metrics HTTP server.
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      # Uses wget (available in Alpine) to probe the /health endpoint.
      # wget exits non-zero on HTTP errors, which satisfies Docker's check.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Health-check sidecar ────────────────────────────────────────────────────
  # Polls the keeper's /health endpoint and sends SIGTERM to PID 1 of the
  # keeper container after FAILURE_THRESHOLD consecutive failures, causing
  # Docker to restart it (per the keeper's restart: unless-stopped policy).
  keeper-sidecar:
    image: curlimages/curl:8.7.1   # tiny image (~12 MB) with curl pre-installed
    depends_on:
      - keeper
    volumes:
      - ./keeper/health-check-sidecar.sh:/sidecar/health-check-sidecar.sh:ro
    environment:
      HEALTH_URL: "http://keeper:3000/health"
      POLL_INTERVAL_S: "${SIDECAR_POLL_INTERVAL_S:-15}"
      FAILURE_THRESHOLD: "${SIDECAR_FAILURE_THRESHOLD:-3}"
      # Signal the keeper container's entrypoint process via the shared network.
      # In a real deployment replace with: supervisorctl restart keeper
      RESTART_CMD: "wget -qO- --post-data='' http://keeper:3000/health || true"
    entrypoint: ["sh", "/sidecar/health-check-sidecar.sh"]
    restart: unless-stopped

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sorotask}:${POSTGRES_PASSWORD:-sorotask}@postgres:5432/${POSTGRES_DB:-sorotask}"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
