apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sorotask-keeper
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SoroLabs/SoroTask.git
    targetRevision: main
    path: charts/sorotask-keeper
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sorotask
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
