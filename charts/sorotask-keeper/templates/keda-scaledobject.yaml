{{- if .Values.keda.enabled -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "sorotask-keeper.fullname" . }}-redis-auth
  labels:
    {{- include "sorotask-keeper.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: address
      name: {{ include "sorotask-keeper.secretName" . }}
      key: REDIS_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sorotask-keeper.fullname" . }}-scaledobject
  labels:
    {{- include "sorotask-keeper.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sorotask-keeper.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 15
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 3
              periodSeconds: 60
  triggers:
    - type: redis
      metadata:
        address: {{ .Values.keda.redis.address | quote }}
        listName: {{ .Values.keda.redis.listName | quote }}
        listLength: {{ .Values.keda.redis.targetListLength | quote }}
      authenticationRef:
        name: {{ include "sorotask-keeper.fullname" . }}-redis-auth
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.keda.prometheus.serverAddress | quote }}
        metricName: sorotask_due_tasks_backlog
        query: {{ .Values.keda.prometheus.dueTasksQuery | quote }}
        threshold: {{ .Values.keda.prometheus.dueTasksThreshold | quote }}
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.keda.prometheus.serverAddress | quote }}
        metricName: sorotask_network_tx_volume
        query: {{ .Values.keda.prometheus.networkTxVolumeQuery | quote }}
        threshold: {{ .Values.keda.prometheus.networkTxVolumeThreshold | quote }}
{{- end -}}
