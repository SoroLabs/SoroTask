{{- if .Values.secrets.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "sorotask-keeper.secretName" . }}
  labels:
    {{- include "sorotask-keeper.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- required "secrets.sealedSecret.encryptedData is required when sealedSecret.enabled is true" .Values.secrets.sealedSecret.encryptedData | toYaml | nindent 4 }}
  template:
    metadata:
      name: {{ include "sorotask-keeper.secretName" . }}
      labels:
        {{- include "sorotask-keeper.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
