{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorotask-keeper.secretName" . }}
  labels:
    {{- include "sorotask-keeper.labels" . | nindent 4 }}
type: Opaque
stringData:
  SOROBAN_RPC_URL: {{ .Values.secrets.sorobanRpcUrl | quote }}
  NETWORK_PASSPHRASE: {{ .Values.secrets.networkPassphrase | quote }}
  CONTRACT_ID: {{ .Values.secrets.contractId | quote }}
  KEEPER_SECRET: {{ .Values.secrets.keeperSecret | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
{{- end -}}
