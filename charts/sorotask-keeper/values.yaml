replicaCount: 3

image:
  repository: ghcr.io/sorolabs/sorotask-keeper
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 3001

terminationGracePeriodSeconds: 45

drain:
  timeoutMs: 30000
  preStopSleepSeconds: 5

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

secrets:
  create: true
  existingSecret: ""
  sorobanRpcUrl: "https://soroban-testnet.stellar.org"
  networkPassphrase: "Test SDF Network ; September 2015"
  contractId: "CDUMMYCONTRACTID0000000000000000000000000000000000000000"
  keeperSecret: ""
  redisUrl: "redis://redis-master.default.svc.cluster.local:6379"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleUpStabilizationWindowSeconds: 0

keda:
  enabled: true
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 3
  maxReplicaCount: 50
  redis:
    address: "redis-master.default.svc.cluster.local:6379"
    listName: "sorotask:due_tasks:queue"
    targetListLength: "10"
  prometheus:
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
    dueTasksQuery: "sum(sorotask_due_tasks_backlog)"
    dueTasksThreshold: "15"
    networkTxVolumeQuery: "sum(rate(sorotask_network_tx_total[1m]))"
    networkTxVolumeThreshold: "50"
